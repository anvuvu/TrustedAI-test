    answer: "You might enjoy The Usual Suspects, which similar users rated 4.25."
    recommended: [10]
    rule: V1
  - id: bare_title_lowercase
    answer: "Try [[m:4]]. It is darker than pulp fiction."
    recommended: [4]
    rule: V1
  - id: invented_placeholder
    answer: "Try [[m:9]]."
    recommended: []
    rule: V1
  - id: unknown_movie_id
    answer: "Try [[m:424242]]."
    recommended: []
    rule: V1
  - id: not_from_recommend
    answer: "Try [[m:5]]."
    recommended: [5]
    rule: V2
  - id: already_seen
    answer: "Watch [[m:2]] again."
    recommended: [2]
    rule: V2
  - id: excluded_genre
    answer: "Try [[m:4]] and [[m:10]]."
    recommended: [4, 10]
    exclude_genres: [Thriller]
    rule: V2
  - id: wrong_rating
    answer: "Similar users rated [[m:10]] 4.8 on average."
    recommended: [10]
    rule: V3
  - id: wrong_count
    answer: "13 similar users rated [[m:10]]."
    recommended: [10]
