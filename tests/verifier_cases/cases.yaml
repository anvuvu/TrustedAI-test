    answer: "1. [[m:10]] — 12 similar users rated it 4.25 on average (46% liked it).\n2. [[m:4]] — a 3.9 Bayesian average."
    recommended: [10, 4]
  - id: rounded_values
    answer: "Similar users rated [[m:10]] about 4.3; 46% of them liked it."
    recommended: [10]
  - id: years_and_ordinals_are_ignored
    answer: "1. [[m:4]] is from 1995, and [[m:10]] also came out in 1995."
    recommended: [4, 10]
  - id: history_movies_can_be_mentioned
    answer: "Because you rated [[m:2]] and [[m:15]] highly, try [[m:10]]."
    recommended: [10]
