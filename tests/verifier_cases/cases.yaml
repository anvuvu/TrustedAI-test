# Crafted answers for the verifier self-test (I5). Context for every case:
#   movies seen in tool results this session: 2, 4, 5, 10, 15
#   recommended by `recommend` in this or the previous turn: 4, 10
#   the user has rated: 2, 5, 15
#   active excluded genres: Horror
#   numbers in recent tool outputs: 4.25, 12, 0.46, 3.9, 7
bad:
