# Agent scenarios (design §9.4). Generated once; edit by hand from here on.
scenarios:
  - id: tonight_u1
    user_id: 1
    tags: [sample]
    turns:
      - user: "What should I watch tonight?"
        expect: {"tools": ["recommend"], "recommends": true}
  - id: dark_thriller_u1
    user_id: 1
    tags: [sample]
    turns:
      - user: "I want a dark psychological thriller with a twist"
        expect: {"tools": ["recommend"], "recommends": true}
  - id: peers_pulp_fiction_u1
    user_id: 1
    tags: [sample]
    turns:
      - user: "What do people with similar taste to mine think about Pulp Fiction?"
        expect: {"tools": ["find_movie", "peer_opinion"], "recommends": false}
  - id: why_that_u1
    user_id: 1
    tags: [sample]
    turns:
      - user: "Recommend one movie for tonight."
        expect: {"tools": ["recommend"], "recommends": true}
      - user: "Why do you think I'd like that?"
        expect: {"tools": ["explain"]}
  - id: toy_story_no_animation_u1
    user_id: 1
    tags: [sample]
    turns:
      - user: "I liked Toy Story but I'm tired of animated movies — what else?"
        expect: {"tools": ["find_movie", "recommend"], "recommends": true, "exclude_genres": ["Animation"]}
  - id: blind_spot_u1
    user_id: 1
    tags: [sample]
    turns:
      - user: "What's my blind spot? What genres am I missing?"
        expect: {"tools": ["get_user_profile"]}
